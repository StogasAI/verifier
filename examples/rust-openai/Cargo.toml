[package]
name = "stogas-openai-example"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "middleware"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false }
stogas = { path = "../../crates/cli" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
axum = "0.8"
serde_json = "1"
stogas-verifier = { path = "../../crates/verifier" }
