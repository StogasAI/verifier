name: Publish reviewed release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  metadata:
    name: Validate published release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./packages/offline-sigstore/package.json').version")" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "$version"
          test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  npm:
    name: npm
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
      - name: Download and verify the reviewed npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern 'stogas-*.tgz' --pattern SHA256SUMS
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'stogas-*.tgz' -printf '%p\n' | LC_ALL=C sort)
          test "${#packages[@]}" = 2
          release_commit="$(git rev-parse HEAD)"
          for package in "${packages[@]}"; do
            name="${package#dist/}"
            awk -v name="$name" '$2 == name { print; count++ } END { exit count == 1 ? 0 : 1 }' \
              dist/SHA256SUMS | (cd dist && sha256sum -c -)
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$release_commit"
          done
      - name: Publish both reviewed npm packages
        shell: bash
        run: |
          set -euo pipefail
          for package in dist/stogas-*.tgz; do
            npm publish "$package" --access public --provenance
          done

  pypi:
    name: PyPI
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download and verify every reviewed wheel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern '*.whl' --pattern SHA256SUMS
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -printf '%p\n' | LC_ALL=C sort)
          test "${#wheels[@]}" = 5
          release_commit="$(git rev-parse HEAD)"
          for wheel in "${wheels[@]}"; do
            name="${wheel#dist/}"
            awk -v name="$name" '$2 == name { print; count++ } END { exit count == 1 ? 0 : 1 }' \
              dist/SHA256SUMS | (cd dist && sha256sum -c -)
            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$release_commit"
          done
          rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          print-hash: true

  crates-io:
    name: crates.io
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Verify reviewed crate archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern '*.crate' --pattern SHA256SUMS
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.crate' -printf '%p\n' | LC_ALL=C sort)
          test "${#packages[@]}" = 3
          release_commit="$(git rev-parse HEAD)"
          for package in "${packages[@]}"; do
            name="${package#dist/}"
            awk -v name="$name" '$2 == name { print; count++ } END { exit count == 1 ? 0 : 1 }' \
              dist/SHA256SUMS | (cd dist && sha256sum -c -)
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$release_commit"
          done
      - name: Publish the dependency before the branded verifier
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          publish_if_absent() {
            local package="$1"
            if cargo info "$package@$version" --registry crates-io >/dev/null 2>&1; then
              echo "$package $version is already published"
              return
            fi
            cargo publish --locked --package "$package"
          }
          publish_if_absent stogas-offline-sigstore
          for attempt in $(seq 1 30); do
            cargo info "stogas-offline-sigstore@$version" --registry crates-io >/dev/null 2>&1 && break
            if [ "$attempt" = 30 ]; then
              echo 'stogas-offline-sigstore did not become visible on crates.io' >&2
              exit 1
            fi
            sleep 10
          done
          publish_if_absent stogas-verifier
          for attempt in $(seq 1 30); do
            cargo info "stogas-verifier@$version" --registry crates-io >/dev/null 2>&1 && break
            if [ "$attempt" = 30 ]; then
              echo 'stogas-verifier did not become visible on crates.io' >&2
              exit 1
            fi
            sleep 10
          done
          publish_if_absent stogas
