name: Continuous fuzzing

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    concurrency:
      group: verifier-fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: [sigstore, bundle_x509_snp_drand, heartbeat_admission, c_abi, e2ee_client]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-01
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
      - name: Restore generated fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}-
            verifier-fuzz-${{ runner.os }}-${{ matrix.target }}-
      - run: cargo install cargo-fuzz --version =0.13.2 --locked
      - run: cargo fuzz run "${{ matrix.target }}" -- -max_total_time=300 -timeout=15
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
