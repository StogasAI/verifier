[package]
name = "stogas-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
serde_json = "1"
libfuzzer-sys = "0.4.13"
stogas-offline-sigstore = { path = "../crates/offline-sigstore" }
stogas-verifier = { path = "../crates/verifier", features = ["staging"] }
stogas-verifier-ffi = { path = "../crates/ffi" }

[[bin]]
name = "sigstore"
path = "fuzz_targets/sigstore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "current_evidence"
path = "fuzz_targets/current_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_evidence"
path = "fuzz_targets/session_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_abi"
path = "fuzz_targets/c_abi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_setup"
path = "fuzz_targets/encrypted_setup.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
