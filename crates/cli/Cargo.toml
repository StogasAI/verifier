[package]
name = "stogas"
description = "The Stogas SDK for verified confidential AI connections"
readme = "../../README.md"
homepage = "https://github.com/StogasAI/verifier"
documentation = "https://docs.rs/stogas"
keywords = ["confidential-computing", "sev-snp", "openai", "e2ee"]
categories = ["api-bindings", "authentication", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "stogas-verify"
path = "src/main.rs"

[lib]
name = "stogas"
path = "src/lib.rs"

[features]
staging = ["stogas-verifier/staging"]

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
base64.workspace = true
clap = { version = "4.5.47", features = ["derive"] }
futures-util = "0.3.31"
getrandom = "0.4.3"
hex.workspace = true
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["http2", "json", "rustls-tls-webpki-roots-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json.workspace = true
sha2.workspace = true
stogas-verifier = { path = "../verifier", version = "0.1.0-alpha.1" }
thiserror.workspace = true
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.4"
url = "2.5.7"
webpki-roots = "1.0.2"
x509-parser = { version = "0.18.0", default-features = false }

[dev-dependencies]
aws-lc-rs = "1.17.1"
ed25519-dalek.workspace = true
h2 = "0.4.15"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "aes", "x25519", "mlkem"] }
rcgen = "0.14.4"
tokio = { version = "1.47.1", features = ["test-util"] }

[lints]
workspace = true
