[package]
name = "stogas-verifier-wasm"
description = "WebAssembly bindings for stogas-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
staging = ["stogas-verifier/staging"]

[dependencies]
base64.workspace = true
js-sys = "0.3.78"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom-02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
hex.workspace = true
serde-wasm-bindgen = "0.6.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stogas-offline-sigstore = { path = "../offline-sigstore" }
stogas-verifier = { path = "../verifier" }
wasm-bindgen = "0.2.101"

[lints]
workspace = true
