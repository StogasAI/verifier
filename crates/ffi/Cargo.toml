[package]
name = "stogas-verifier-ffi"
description = "Bounded C ABI for stogas-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["transport"]
transport = ["dep:stogas-sdk"]
staging = ["stogas-verifier/staging", "stogas-sdk?/staging"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
stogas-sdk = { package = "stogas", path = "../cli", optional = true }
stogas-verifier = { path = "../verifier" }

[dev-dependencies]
base64.workspace = true
hex.workspace = true

[lints.rust]
missing_docs = "allow"
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
